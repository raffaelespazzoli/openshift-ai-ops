backend:
  replicaCount: 1
  image:
    repository: quay.io/openshift-ai-ops/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

correlation:
  settlingWindows:
    critical: 60
    warning: 300
    info: 600
  maxAgeMultiplier: 3
  sealingCheckIntervalSeconds: 10

alertmanager:
  url: ""

queue:
  parallelismCap: 3
  ttlSeconds: 3600
  pollIntervalSeconds: 5
  staleProcessingTimeoutSeconds: 900
  priorityWeights:
    critical: 100
    warning: 50
    info: 10

mcpReadonly:
  replicaCount: 1
  image:
    repository: ghcr.io/containers/kubernetes-mcp-server
    tag: "v0.0.66"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

solr:
  image:
    repository: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9
    tag: "latest"
    pullPolicy: IfNotPresent
  accessKeySecret: rhokp-access-key
  storage:
    size: 15Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

okpMcp:
  image:
    repository: quay.io/redhat-user-workloads/rhel-lightspeed-tenant/rhel-knowledge-bridge
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

agenticSkills:
  image:
    repository: quay.io/openshift/agentic-skills
    tag: "latest"
    pullPolicy: IfNotPresent

learningStore:
  decayHalfLifeDays: 90
  similarityThreshold: 0.75

postgresql:
  replicaCount: 1
  image:
    repository: pgvector/pgvector
    tag: "pg18"
    pullPolicy: IfNotPresent
  port: 5432
  credentials:
    username: postgres
    password: ""
    database: openshift_ai_ops
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
