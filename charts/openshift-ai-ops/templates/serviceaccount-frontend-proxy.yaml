apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-frontend-proxy
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.frontend: "https://{{ .Values.frontend.route.host }}/oauth/callback"
{{- with .Values.frontend.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . | quote }}
  {{- end }}
{{- end }}
