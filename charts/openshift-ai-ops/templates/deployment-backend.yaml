apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              python -c "
              import psycopg
              conn = psycopg.connect(
                  host='{{ .Release.Name }}-postgresql',
                  port={{ .Values.postgresql.port }},
                  user='{{ .Values.postgresql.credentials.username }}',
                  password='$POSTGRES_PASSWORD',
                  dbname='{{ .Values.postgresql.credentials.database }}',
                  autocommit=True,
              )
              conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
              conn.close()
              " && alembic -c /app/alembic.ini upgrade head
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgresql.credentials.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:{{ .Values.postgresql.port }}/{{ .Values.postgresql.credentials.database }}"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgresql.port }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgresql.credentials.username }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: "{{ .Values.postgresql.credentials.database }}"
            - name: CORRELATION_SETTLING_CRITICAL
              value: "{{ .Values.correlation.settlingWindows.critical }}"
            - name: CORRELATION_SETTLING_WARNING
              value: "{{ .Values.correlation.settlingWindows.warning }}"
            - name: CORRELATION_SETTLING_INFO
              value: "{{ .Values.correlation.settlingWindows.info }}"
            - name: CORRELATION_MAX_AGE_MULTIPLIER
              value: "{{ .Values.correlation.maxAgeMultiplier }}"
            - name: CORRELATION_SEALING_INTERVAL
              value: "{{ .Values.correlation.sealingCheckIntervalSeconds }}"
            - name: QUEUE_PARALLELISM_CAP
              value: "{{ .Values.queue.parallelismCap }}"
            - name: QUEUE_TTL_SECONDS
              value: "{{ .Values.queue.ttlSeconds }}"
            - name: QUEUE_POLL_INTERVAL_SECONDS
              value: "{{ .Values.queue.pollIntervalSeconds }}"
            - name: QUEUE_STALE_PROCESSING_TIMEOUT_SECONDS
              value: "{{ .Values.queue.staleProcessingTimeoutSeconds }}"
            - name: QUEUE_PRIORITY_WEIGHT_CRITICAL
              value: "{{ .Values.queue.priorityWeights.critical }}"
            - name: QUEUE_PRIORITY_WEIGHT_WARNING
              value: "{{ .Values.queue.priorityWeights.warning }}"
            - name: QUEUE_PRIORITY_WEIGHT_INFO
              value: "{{ .Values.queue.priorityWeights.info }}"
            - name: MCP_READONLY_URL
              value: "http://{{ .Release.Name }}-mcp-readonly:{{ .Values.mcpReadonly.port }}/mcp"
            - name: MCP_READWRITE_URL
              value: "http://{{ .Release.Name }}-mcp-readwrite:{{ .Values.mcpReadwrite.port }}/mcp"
            - name: RHOKP_MCP_URL
              value: "http://{{ .Release.Name }}-okp-mcp:{{ .Values.okpMcp.port }}/mcp"
            - name: SKILLS_DIRECTORY
              value: "/skills"
            - name: LEARNING_STORE_DECAY_HALF_LIFE_DAYS
              value: "{{ .Values.learningStore.decayHalfLifeDays }}"
            - name: LEARNING_STORE_SIMILARITY_THRESHOLD
              value: "{{ .Values.learningStore.similarityThreshold }}"
            - name: LEARNING_STORE_VERSION_RELEVANCE_SAME_MAJOR
              value: "{{ .Values.learningStore.versionRelevanceSameMajor }}"
            - name: LEARNING_STORE_VERSION_RELEVANCE_DIFFERENT_MAJOR
              value: "{{ .Values.learningStore.versionRelevanceDifferentMajor }}"
            - name: LEARNING_STORE_VERSION_RELEVANCE_MINOR_PENALTY
              value: "{{ .Values.learningStore.versionRelevanceMinorPenalty }}"
            {{- if .Values.alertmanager.url }}
            - name: ALERTMANAGER_URL
              value: "{{ .Values.alertmanager.url }}"
            {{- end }}
            - name: APPROVAL_MIN_REVIEW_ENABLED
              value: "{{ .Values.approval.minimumReviewEnabled }}"
            - name: APPROVAL_MIN_REVIEW_NODE
              value: "{{ .Values.approval.minimumReviewSecondsNode }}"
            - name: APPROVAL_MIN_REVIEW_CLUSTER
              value: "{{ .Values.approval.minimumReviewSecondsCluster }}"
            - name: POLICY_SEVERITY_AUTO_APPROVE
              value: "{{ .Values.policyGate.severityAutoApprove }}"
            - name: POLICY_BLAST_RADIUS_AUTO_APPROVE
              value: "{{ .Values.policyGate.blastRadiusAutoApprove }}"
            - name: POLICY_CONFIDENCE_MINIMUM
              value: "{{ .Values.policyGate.confidenceMinimum }}"
            - name: EXECUTION_OBSERVATION_TIMEOUT
              value: "{{ .Values.execution.observationTimeoutSeconds }}"
            - name: EXECUTION_COOLDOWN_SECONDS
              value: "{{ .Values.execution.cooldownSeconds }}"
            - name: EXECUTION_REFIRE_WINDOW
              value: "{{ .Values.execution.refireWindowSeconds }}"
            - name: EXECUTION_LOCK_POLL_INTERVAL
              value: "{{ .Values.execution.lockPollIntervalSeconds }}"
            - name: LLM_ENDPOINT
              value: "{{ .Values.llm.endpoint }}"
            - name: LLM_MODEL
              value: "{{ .Values.llm.model }}"
            - name: LLM_TEMPERATURE
              value: "{{ .Values.llm.temperature }}"
            - name: LLM_MAX_TOKENS
              value: "{{ .Values.llm.maxTokens }}"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKeySecret.name }}
                  key: {{ .Values.llm.apiKeySecret.key }}
            - name: EMBEDDING_ENDPOINT
              value: "{{ .Values.llm.endpoint }}"
            - name: EMBEDDING_MODEL
              value: "{{ .Values.llm.embeddingModel | default "text-embedding-3-small" }}"
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKeySecret.name }}
                  key: {{ .Values.llm.apiKeySecret.key }}
          volumeMounts:
            - name: agentic-skills
              mountPath: /skills
              subPath: skills
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: agentic-skills
          image:
            reference: "{{ .Values.agenticSkills.image.repository }}:{{ .Values.agenticSkills.image.tag }}"
            pullPolicy: {{ .Values.agenticSkills.image.pullPolicy | default "IfNotPresent" }}
