apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgresql.port }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgresql.credentials.username }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: "{{ .Values.postgresql.credentials.database }}"
            - name: CORRELATION_SETTLING_CRITICAL
              value: "{{ .Values.correlation.settlingWindows.critical }}"
            - name: CORRELATION_SETTLING_WARNING
              value: "{{ .Values.correlation.settlingWindows.warning }}"
            - name: CORRELATION_SETTLING_INFO
              value: "{{ .Values.correlation.settlingWindows.info }}"
            - name: CORRELATION_MAX_AGE_MULTIPLIER
              value: "{{ .Values.correlation.maxAgeMultiplier }}"
            - name: CORRELATION_SEALING_INTERVAL
              value: "{{ .Values.correlation.sealingCheckIntervalSeconds }}"
            - name: QUEUE_PARALLELISM_CAP
              value: "{{ .Values.queue.parallelismCap }}"
            - name: QUEUE_TTL_SECONDS
              value: "{{ .Values.queue.ttlSeconds }}"
            - name: QUEUE_POLL_INTERVAL_SECONDS
              value: "{{ .Values.queue.pollIntervalSeconds }}"
            - name: QUEUE_STALE_PROCESSING_TIMEOUT_SECONDS
              value: "{{ .Values.queue.staleProcessingTimeoutSeconds }}"
            - name: QUEUE_PRIORITY_WEIGHT_CRITICAL
              value: "{{ .Values.queue.priorityWeights.critical }}"
            - name: QUEUE_PRIORITY_WEIGHT_WARNING
              value: "{{ .Values.queue.priorityWeights.warning }}"
            - name: QUEUE_PRIORITY_WEIGHT_INFO
              value: "{{ .Values.queue.priorityWeights.info }}"
            - name: MCP_READONLY_URL
              value: "http://{{ .Release.Name }}-mcp-readonly:{{ .Values.mcpReadonly.port }}/mcp"
            {{- if .Values.alertmanager.url }}
            - name: ALERTMANAGER_URL
              value: "{{ .Values.alertmanager.url }}"
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
