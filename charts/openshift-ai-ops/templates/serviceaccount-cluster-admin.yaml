apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cluster-admin
  labels:
    app.kubernetes.io/name: cluster-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-readwrite
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-admin
  labels:
    app.kubernetes.io/name: cluster-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cluster-admin
  namespace: {{ .Release.Namespace }}
