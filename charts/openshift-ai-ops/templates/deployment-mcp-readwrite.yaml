apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-readwrite
  labels:
    app.kubernetes.io/name: mcp-readwrite
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-readwrite
spec:
  replicas: {{ .Values.mcpReadwrite.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-readwrite
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-readwrite
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-readwrite
    spec:
      serviceAccountName: {{ .Release.Name }}-cluster-admin
      containers:
      - name: mcp-readwrite
        image: "{{ .Values.mcpReadwrite.image.repository }}:{{ .Values.mcpReadwrite.image.tag }}"
        imagePullPolicy: {{ .Values.mcpReadwrite.image.pullPolicy }}
        args: ["--port", "{{ .Values.mcpReadwrite.port }}"]
        ports:
        - name: http
          containerPort: {{ .Values.mcpReadwrite.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /mcp
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.mcpReadwrite.resources | nindent 10 }}
