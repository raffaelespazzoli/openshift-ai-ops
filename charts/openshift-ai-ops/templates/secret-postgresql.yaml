{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "password") }}
  password: {{ index $existingSecret.data "password" }}
  {{- else if .Values.postgresql.credentials.password }}
  password: {{ .Values.postgresql.credentials.password | b64enc | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
