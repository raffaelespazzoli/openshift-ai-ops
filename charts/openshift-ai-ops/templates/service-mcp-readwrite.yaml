apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-readwrite
  labels:
    app.kubernetes.io/name: mcp-readwrite
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-readwrite
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.mcpReadwrite.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: mcp-readwrite
    app.kubernetes.io/instance: {{ .Release.Name }}
