apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-readonly
  labels:
    app.kubernetes.io/name: mcp-readonly
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-readonly
spec:
  replicas: {{ .Values.mcpReadonly.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-readonly
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-readonly
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-readonly
    spec:
      serviceAccountName: {{ .Release.Name }}-cluster-reader
      containers:
      - name: mcp-readonly
        image: "{{ .Values.mcpReadonly.image.repository }}:{{ .Values.mcpReadonly.image.tag }}"
        imagePullPolicy: {{ .Values.mcpReadonly.image.pullPolicy }}
        args: ["--port", "{{ .Values.mcpReadonly.port }}", "--read-only"]
        ports:
        - name: http
          containerPort: {{ .Values.mcpReadonly.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.mcpReadonly.resources | nindent 10 }}
